add_newline = false
command_timeout = 300
scan_timeout = 20
palette = "cleanpower"

format = """
[](fg:orange)\
[ ](bg:orange fg:black bold)\
[](fg:orange bg:teal)\
$directory\
$git_branch\
$git_status\
$cmd_duration\
[](fg:slate)\
$time\
$line_break\
$character"""

[palettes.cleanpower]
orange = "#E48A2A"
teal = "#6FAEA5"
mint = "#88B06A"
slate = "#3A3A3A"
fg = "#EAE7DC"
black = "#1F1F1F"

[directory]
truncation_length = 3
truncate_to_repo = false
home_symbol = "~"
style = "bg:teal fg:black bold"
format = "[ $path ]($style)[](fg:teal bg:mint)"

[git_branch]
symbol = " "
style = "bg:mint fg:black bold"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:mint fg:black bold"
format = "[ $all_status$ahead_behind ]($style)[](fg:mint bg:slate)"

[cmd_duration]
min_time = 700
style = "bg:slate fg:fg"
format = "[ $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "bg:slate fg:fg"
format = "[  $time ]($style)[](fg:slate)"

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
vimcmd_symbol = "[❮](bold blue) "
