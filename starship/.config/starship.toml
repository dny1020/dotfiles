add_newline = false
command_timeout = 300
scan_timeout = 20
palette = "pastel"

format = """
[](fg:amber)\
[ ](bg:amber fg:black bold)\
[](fg:amber bg:blue)\
$directory\
$git_branch\
$git_status\
$cmd_duration\
[](fg:slate)\
$time\
$line_break\
$character"""

[palettes.pastel]
amber = "#C8A97A"
blue  = "#7BA7BC"
slate = "#3A3A3A"
fg    = "#EAE7DC"
black = "#1F1F1F"

[directory]
truncation_length = 3
truncate_to_repo = false
home_symbol = "~"
style = "bg:blue fg:black bold"
format = "[ $path ]($style)[](fg:blue bg:blue)"

[git_branch]
symbol = " "
style = "bg:blue fg:black bold"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:blue fg:black bold"
format = "[ $all_status$ahead_behind ]($style)[](fg:blue bg:slate)"

[cmd_duration]
min_time = 700
style = "bg:slate fg:fg"
format = "[ $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "bg:slate fg:fg"
format = "[ $time ]($style)[](fg:slate)"

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
vimcmd_symbol = "[❮](bold blue) "
