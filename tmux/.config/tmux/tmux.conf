# ~/.config/tmux/tmux.conf
# tmux minimalista, tema Gruvbox dark + amarillo opaco (acorde con la barra de i3/rofi).
# Prefijo Ctrl+a (y Ctrl+b), scroll con ratón, divisiones que heredan el directorio.

# ── Prefijo: Ctrl+a principal, Ctrl+b sigue valiendo ─────────────────────────
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix            # Ctrl+a Ctrl+a -> envía un Ctrl+a literal

# ── Scroll / ratón ───────────────────────────────────────────────────────────
set -g mouse on                 # rueda = scroll (entra en modo copia); clic selecciona panel
set -g history-limit 50000      # historial largo para scrollear hacia atrás
set -g extended-keys on
# ── Ventanas: Ctrl+a p / Ctrl+a Ctrl+p = anterior · n / Ctrl+n = siguiente ────
bind p   previous-window
bind C-p previous-window
bind n   next-window
bind C-n next-window

# ── Divisiones de panel (heredan el directorio actual) ───────────────────────
bind % split-window -h -c "#{pane_current_path}"    # Ctrl+a %  -> vertical
bind '"' split-window -v -c "#{pane_current_path}"   # Ctrl+a "  -> horizontal
bind c new-window -c "#{pane_current_path}"
# Mover el foco entre paneles estilo vim/i3 (Ctrl+a + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Calidad de vida ──────────────────────────────────────────────────────────
set -g base-index 1             # ventanas desde 1 (como tus workspaces de i3)
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10           # sin lag al pulsar Esc en nvim
set -g focus-events on
setw -g mode-keys vi            # modo copia estilo vi
bind -T copy-mode-vi v send -X begin-selection
# `y` y la selección con ratón copian al portapapeles real del sistema, no solo
# al buffer de tmux. El comando depende del SO: pbcopy (macOS) o xclip (Linux/WSL).
if-shell "command -v pbcopy" {
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
} {
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
}
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux recargado"

# ── Color verdadero (Alacritty) ──────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB,xterm*:RGB"

# ── Tema: Gruvbox dark + amarillo opaco #d79921 (igual que la barra de i3) ────
set -g status-style "bg=#1d2021,fg=#d5c4a1"
set -g status-justify left
set -g status-left "#[bg=#d79921,fg=#1d2021,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#928374]%Y-%m-%d #[fg=#d5c4a1]%H:%M "

# Ventana activa: fondo gris-Gruvbox + texto amarillo opaco (como el workspace i3 activo)
setw -g window-status-current-style "bg=#3c3836,fg=#d79921,bold"
setw -g window-status-current-format " #I:#W "
# Ventanas inactivas: atenuadas
setw -g window-status-style "bg=#1d2021,fg=#928374"
setw -g window-status-format " #I:#W "
setw -g window-status-separator ""

# Bordes de panel: activo en amarillo opaco
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d79921"
# Mensajes y selección en modo copia
set -g message-style "bg=#3c3836,fg=#d79921"
set -g mode-style "bg=#d79921,fg=#1d2021"
