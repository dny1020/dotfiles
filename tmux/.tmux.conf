# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Rendimiento y usabilidad
set -g mouse on
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",*:RGB"
set -g focus-events on
set -g history-limit 100000
set -g escape-time 0
set -g set-clipboard on
set -g renumber-windows on

# Recargar config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf recargado"

# Split de paneles (sin conflicto con navegación)
bind | split-window -h
bind - split-window -v
bind = resize-pane -Z

# Navegación tipo Vim (con prefijo)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Navegación sin prefijo entre tmux y nvim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# Alternativa: Alt + flechas
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Copy mode tipo Vim + integración de clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection

# Prioridad de clipboard: macOS -> Linux -> WSL/Windows
if-shell 'command -v pbcopy >/dev/null 2>&1' "set -s copy-command 'pbcopy'"
if-shell 'command -v xclip >/dev/null 2>&1' "set -s copy-command 'xclip -selection clipboard -in'"
if-shell 'command -v clip.exe >/dev/null 2>&1' "set -s copy-command 'clip.exe'"

bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Estilo de panes
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"

# Barra inferior minimalista "powerline" (pocos colores, look redondeado)
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=colour252"
set -g status-left-length 40
set -g status-right-length 70

set -g status-left "#[fg=colour39,bg=default]#[fg=colour235,bg=colour39,bold] #S #[fg=colour39,bg=default] #[fg=colour244]#H"
set -g status-right "#[fg=colour244]%Y-%m-%d #[fg=colour252]%H:%M #[fg=colour39,bg=default]#[fg=colour235,bg=colour39,bold] $USER #[fg=colour39,bg=default]"

setw -g window-status-separator " "
setw -g window-status-format "#[fg=colour244]#I:#W"
setw -g window-status-current-format "#[fg=colour39,bg=default]#[fg=colour235,bg=colour39,bold] #I:#W #[fg=colour39,bg=default]"

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-save-interval '10'
set -g @continuum-restore 'on'

# Carga TPM solo si está instalado
if-shell '[ -d ~/.tmux/plugins/tpm ]' "run '~/.tmux/plugins/tpm/tpm'"
