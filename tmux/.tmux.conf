# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Rendimiento y usabilidad
set -g mouse on
set -g default-terminal "screen-256color"
set -g history-limit 100000
set -g escape-time 0

# Recargar config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf recargado"

# Split de paneles (sin conflicto con navegación)
bind | split-window -h
bind - split-window -v
bind = resize-pane -Z

# Navegación tipo Vim
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Alternativa: Alt + flechas
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Copy mode tipo Vim
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Estilo de panes
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"

# Barra inferior minimalista "powerline" (pocos colores, look redondeado)
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=colour252"
set -g status-left-length 40
set -g status-right-length 70

set -g status-left "#[fg=colour39,bg=default]#[fg=colour235,bg=colour39,bold] #S #[fg=colour39,bg=default] #[fg=colour244]#H"
set -g status-right "#[fg=colour244]%Y-%m-%d #[fg=colour252]%H:%M #[fg=colour39,bg=default]#[fg=colour235,bg=colour39,bold] $USER #[fg=colour39,bg=default]"

setw -g window-status-separator " "
setw -g window-status-format "#[fg=colour244]#I:#W"
setw -g window-status-current-format "#[fg=colour39,bg=default]#[fg=colour235,bg=colour39,bold] #I:#W #[fg=colour39,bg=default]"
