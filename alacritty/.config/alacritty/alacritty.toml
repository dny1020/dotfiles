# Config de Alacritty — universal (Debian/i3, macOS, WSL)
# Atajos de portapapeles (ya vienen por defecto, aquí solo documentados):
#   Ctrl+Shift+C  -> copiar       Ctrl+Shift+V -> pegar
#   Shift+Insert  -> pegar selección (PRIMARY)
#   Seleccionar con el mouse copia automáticamente (ver [selection]).

[general]
# Overrides por máquina (no versionado): p.ej. otro tamaño de fuente en macOS/retina.
# Si el archivo no existe, Alacritty lo ignora en silencio.
import = ["~/.config/alacritty/local.toml"]

[window]
padding = { x = 6, y = 6 }
opacity = 0.92
dynamic_title = true

[font]
size = 7.0
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold   = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }

[scrolling]
history = 10000

[selection]
# Al seleccionar con el mouse, copia también al portapapeles (CLIPBOARD),
# así puedes pegar con Ctrl+Shift+V o Ctrl+V en otras apps.
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "On" }

# Paleta Gruvbox dark. Los 16 ANSI son los mismos valores que ~/.Xresources,
# asi que xterm y alacritty pintan igual. El fondo es #1d2021 (bg0_hard),
# el mismo que i3bar, rofi y el tema de VS Code.
[colors.primary]
background = "#1d2021"
foreground = "#ebdbb2"

[colors.cursor]
text   = "#1d2021"
cursor = "#d79921"

[colors.selection]
background = "#3c3836"
text       = "#ebdbb2"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"
