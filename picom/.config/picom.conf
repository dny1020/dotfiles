# picom - compositor para i3 (AMD Radeon)
# Evita tearing y añade sombras suaves.

backend = "glx";
vsync = true;

# Sombras
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
    "class_g = 'i3-frame'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Transparencia ligera (descomenta si la quieres)
# inactive-opacity = 0.96;
# active-opacity = 1.0;
# frame-opacity = 0.9;

# Esquinas (0 = cuadradas, sube a 8-10 para redondeadas)
corner-radius = 0;

# Rendimiento
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;
