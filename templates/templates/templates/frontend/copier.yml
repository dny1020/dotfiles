_subdirectory: template
_envops:
  trim_blocks: true
  lstrip_blocks: true

project_name:
  type: str
  help: Nombre legible del proyecto (ej. "Panel de Clientes")

project_slug:
  type: str
  help: Nombre del paquete/directorio (slug)
  default: "{{ project_name.lower().replace(' ', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]*$')) %}
    project_slug debe ser minusculas, empezar con letra y usar solo letras, numeros y guiones.
    {% endif %}

project_description:
  type: str
  help: Descripcion corta del proyecto
  default: ""

author_name:
  type: str
  help: Nombre del autor
  default: ""

api_base_url:
  type: str
  help: URL base del backend (api/webservice/agentic/chatbot) que este frontend consume
  default: "http://localhost:8000"

node_version:
  type: str
  help: Version de Node.js
  default: "22"

_tasks:
  - "cp .env.example .env"
