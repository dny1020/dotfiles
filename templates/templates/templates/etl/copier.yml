_subdirectory: template
_envops:
  trim_blocks: true
  lstrip_blocks: true

project_name:
  type: str
  help: Nombre legible del proyecto (ej. "ETL Ventas Diarias")

project_slug:
  type: str
  help: Nombre del paquete/directorio (slug)
  default: "{{ project_name.lower().replace(' ', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]*$')) %}
    project_slug debe ser minusculas, empezar con letra y usar solo letras, numeros y guiones.
    {% endif %}

project_description:
  type: str
  help: Descripcion corta del proyecto
  default: ""

author_name:
  type: str
  help: Nombre del autor
  default: ""

source_url:
  type: str
  help: URL de origen (CSV) desde donde se extraen los datos
  default: "https://example.com/data.csv"

destination:
  type: str
  help: Destino de los datos ya transformados
  choices:
    - duckdb
    - postgresql
  default: duckdb

use_fuzzy_dedup:
  type: bool
  help: "Agregar deduplicacion aproximada (RapidFuzz) ademas del dedup exacto?"
  default: false

python_version:
  type: str
  help: Version de Python
  default: "3.13"

_tasks:
  - "cp .env.example .env"
