_subdirectory: template
_envops:
  trim_blocks: true
  lstrip_blocks: true

project_name:
  type: str
  help: Nombre legible del proyecto (ej. "Facturacion API")

project_slug:
  type: str
  help: Nombre del paquete/directorio (slug)
  default: "{{ project_name.lower().replace(' ', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]*$')) %}
    project_slug debe ser minusculas, empezar con letra y usar solo letras, numeros y guiones.
    {% endif %}

project_description:
  type: str
  help: Descripcion corta del proyecto
  default: ""

author_name:
  type: str
  help: Nombre del autor
  default: ""

use_database:
  type: bool
  help: "Necesita base de datos (SQLAlchemy + Alembic)?"
  default: true

db_engine:
  type: str
  help: Motor de base de datos
  choices:
    - postgresql
    - sqlite
  default: postgresql
  when: "{{ use_database }}"

use_redis:
  type: bool
  help: "Incluir Redis (cache / colas)?"
  default: false

use_auth:
  type: bool
  help: "Proteger los endpoints con un API key simple (header X-API-Key)?"
  default: false

python_version:
  type: str
  help: Version de Python
  default: "3.13"

_tasks:
  - "cp .env.example .env"
