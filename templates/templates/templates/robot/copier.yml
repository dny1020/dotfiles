_subdirectory: template
_envops:
  trim_blocks: true
  lstrip_blocks: true

project_name:
  type: str
  help: Nombre legible del proyecto (ej. "Monitor de Endpoints")

project_slug:
  type: str
  help: Nombre del paquete/directorio (slug)
  default: "{{ project_name.lower().replace(' ', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]*$')) %}
    project_slug debe ser minusculas, empezar con letra y usar solo letras, numeros y guiones.
    {% endif %}

project_description:
  type: str
  help: Descripcion corta del proyecto
  default: ""

author_name:
  type: str
  help: Nombre del autor
  default: ""

check_url:
  type: str
  help: URL que el job de ejemplo va a monitorear
  default: "https://example.com"

interval_minutes:
  type: int
  help: Cada cuantos minutos corre el job
  default: 5

alert_webhook_url:
  type: str
  help: Webhook (Slack/Discord/generico) para alertas. Vacio = solo se loguea la alerta.
  default: ""

use_ml_check:
  type: bool
  help: "Agregar deteccion de anomalias (scikit-learn) sobre el tiempo de respuesta del check?"
  default: false

python_version:
  type: str
  help: Version de Python
  default: "3.13"

_tasks:
  - "cp .env.example .env"
