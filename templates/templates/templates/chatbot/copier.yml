_subdirectory: template
_envops:
  trim_blocks: true
  lstrip_blocks: true

project_name:
  type: str
  help: Nombre legible del proyecto (ej. "Bot de Soporte")

project_slug:
  type: str
  help: Nombre del paquete/directorio (slug)
  default: "{{ project_name.lower().replace(' ', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]*$')) %}
    project_slug debe ser minusculas, empezar con letra y usar solo letras, numeros y guiones.
    {% endif %}

project_description:
  type: str
  help: Descripcion corta del proyecto
  default: ""

author_name:
  type: str
  help: Nombre del autor
  default: ""

llama_model:
  type: str
  help: Modelo de llama.cpp (OpenAI-compatible) a usar por defecto
  default: "qwen3-4b"

use_auth:
  type: bool
  help: "Proteger /chat con un API key simple (header X-API-Key)?"
  default: false

use_rag:
  type: bool
  help: "Agregar RAG local (sentence-transformers + Chroma) como herramienta del agente?"
  default: false

use_nlp:
  type: bool
  help: "Agregar extraccion de entidades (spaCy) y fuzzy matching (RapidFuzz)?"
  default: false

python_version:
  type: str
  help: Version de Python
  default: "3.13"

_tasks:
  - "cp .env.example .env"
