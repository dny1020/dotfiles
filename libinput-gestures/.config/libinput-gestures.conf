# Gestos del trackpad (libinput-gestures) para i3
# 3 dedos: cambiar de workspace izquierda/derecha
gesture swipe left  3 i3-msg workspace next
gesture swipe right 3 i3-msg workspace prev
# 3 dedos arriba: lanzador (rofi) ; abajo: lista de ventanas
gesture swipe up    3 rofi -modi drun,run -show drun
gesture swipe down  3 rofi -show window
# 4 dedos: pantalla completa / flotante de la ventana actual
gesture swipe up    4 i3-msg fullscreen toggle
gesture swipe down  4 i3-msg floating toggle
