# Bluetooth: prioriza calidad de escucha sobre el micro del auricular.
#
# El problema de fondo no es de Linux. Bluetooth no puede dar audio estereo de
# calidad y microfono a la vez: A2DP es solo salida, y en cuanto una app abre
# el micro el dispositivo cae a HFP, que es mono y de banda estrecha. Por eso
# los AirPods suenan mal en Teams o Meet, aqui y en macOS y Windows igual.
#
# autoswitch a false rompe esa caida: los auriculares se quedan siempre en
# A2DP. El micro sale del portatil, que desde 99-echo-cancel.conf ya lleva
# cancelacion de eco y supresion de ruido.
#
# Contrapartida: el microfono de los AirPods deja de ofrecerse. Si alguna vez
# hace falta, se cambia el perfil a mano:
#   pactl set-card-profile bluez_card.XX_XX_XX_XX_XX_XX headset-head-unit-msbc

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  # Si algun dia se usa HFP a mano, que sea mSBC (16 kHz) y no CVSD (8 kHz).
  bluez5.enable-msbc = true
  # SBC XQ: mas bitrate en A2DP para los auriculares que no llevan aptX ni LDAC.
  bluez5.enable-sbc-xq = true
  # Volumen por hardware: el control del auricular mueve el volumen real.
  bluez5.enable-hw-volume = true
}
