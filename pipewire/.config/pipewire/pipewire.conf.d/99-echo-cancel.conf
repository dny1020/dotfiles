# Cancelacion de eco y supresion de ruido para llamadas (Teams, Meet, Jitsi).
#
# Resta de la senal del micro lo que esta sonando por la salida, asi el otro
# lado deja de oirse a si mismo. Sin esto, altavoces + micro del portatil se
# realimentan y la llamada suena con eco y acople.
#
# Los modulos ya venian con Debian (libspa-aec-webrtc, libwebrtc-audio-
# processing); lo unico que faltaba era cargarlos, porque WirePlumber no lo
# hace por defecto.
#
# monitor.mode = true es la parte importante: usa el monitor de la salida
# actual como referencia en vez de crear un sink virtual propio. Asi solo hay
# que cambiar el MICRO a la fuente virtual, y la salida puede seguir siendo la
# que sea (altavoces, jack, AirPods) sin reconfigurar nada al cambiarla.

context.modules = [
    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true
            aec.args = {
                webrtc.gain_control          = true
                webrtc.noise_suppression     = true
                webrtc.high_pass_filter      = true
                webrtc.voice_detection       = true
                webrtc.transient_suppression = false
            }
            capture.props = {
                node.passive = true
            }
            source.props = {
                node.name        = "echo-cancel-source"
                node.description = "Micro (eco cancelado)"
            }
        }
    }
]
