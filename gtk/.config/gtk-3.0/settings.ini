[Settings]
# Adwaita-dark viene dentro de GTK, no es un paquete aparte: no se puede
# romper ni desaparecer en una actualizacion. Los colores Gruvbox se ponen
# encima en gtk.css. Arc-Dark no servia porque fija sus colores internamente
# y no responde a @define-color.
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Papirus-Gruvbox
